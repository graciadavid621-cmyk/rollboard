name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found in the repo. Files:"; find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Gradle project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" RollKeyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RollKeyboard-apk
          path: RollKeyboard.apk

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Roll Keyboard build ${{ github.run_number }}
          body: Install RollKeyboard.apk, enable it in Settings > Languages & input, then select it as your keyboard. Good luck with the rolls!
          files: RollKeyboard.apk
